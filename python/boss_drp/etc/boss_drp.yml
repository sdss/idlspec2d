# Setting for Finding the Data
general:
    BOSS_SPECTRO_REDUX: ${BOSS_SPECTRO_REDUX}       # Base directory for BOSS Spectro Reduction outputs  
    RUN2D: ${RUN2D}                                 # RUN2D version 
    RUN1D: ${RUN1D}                                 # RUN1D version 
    idlutils_1d:                                    # IDLUtils Version for 1d pipe (if different from default)
    RELEASE: sdsswork                               # SDSS_ACCESS Release for data access
    V_TARG:                                         # MOS_TARGET product version (for no_db access)
    REMOTE:                                         # Use SDSS_ACCESS remote to retreive files
    module:                                         # SDSSV Module file (used to track daily run progress - can run without)


Stage:  #Run this step of the pipeline (True/False) in uubatchpbs/uurundaily
    run_plan: True                                  # Run the plan step (True/False)
    run_spTrace_plan: True                          # Run the spTrace plan step (True/False)           
    run_fibermap: True                              # Run the spFibermap step (True/False)               
    run_spTrace: True                               # Run the spTrace step (True/False)    
    run_reduce2d: True                              # Run the 2d reduction/extraction step (True/False)
    run_combine: True                               # Run the coadding step (True/False)
    run_analyze: True                               # Run the 1d analysis step (True/False)
    run_XCSAO: True                                 # Run the XCSAO analysis step (True/False)
    run_fieldlist: True                             # Run Fieldlist creation step; This should be false for custom 
    run_fieldmerge: True                            # Run the field-level spAll creation step (True/False)
    run_specFiles: True                             # Run the step to create Spec files (and plots) for each spectrum (True/False)          
    run_spcalib: True                               # Run the spCalib step (True/False); This should be false for custom coadds
    run_healpix:                                    # Run the step to create Healpix files for each spectrum (True/False)
    run_Summarymerge: False                         # Run the step to merge spAll files into a single spAll summary file (True/False)

Clobber:
    clobber_pipe:                                   # Clobber the "redux" scripts (True/False)
    clobber_plan: False                             # Clobber the spPlan* files (True/False)   
    clobber_fibermap: False                         # Clobber the spFibermap files (True/False)
    clobber_spTrace: False                          # Clobber the spTrace files (True/False)
#     reduce2d: True
#     reduce1d: True
#     analyze: True
#     post: True

fmjdselect:
    obs:                                            # Select by obs (APO, LCO)
    field:                                          # Selet by fieldid
    fieldstart:                                     # Select Range of fieldids >= fieldstart               
    fieldend:                                       # Select Range of fieldids <= fieldend   
    mjd:                                            # Select by MJD             
    mjdstart:                                       # Select Range of MJDs >= mjdstart
    mjdend:                                         # Select Range of MJDs <= mjdend
    epoch:                                          # Epoch Coadd Selection (True/False)
    custom:                                         # Custom Coadd selection (eg. allepoch) (True/False)
    dither: False                                   # Include Fiber Dither Engineering fields (True/False)    
    commissioning: True                             # Include Commissioning fields (True/False) 
    batch_mjd: False                                # Batch submission of multiple MJDs (True/False) 
    trace_all_mjds: False                           # Run spTrace on all MJDs in the selected range rather than just the MJDs of the spPlan2d files (True/False)   
    increment_nextmjd:                              # Increment NextMJD file even when specifying an MJD for daily run
    daily_epoch:                                    # Run Epoch Coadds after daily coadds during "boss_drp daily" job
    
SDSS_Generation:                                    
    sdssv: True                                     # Use SDSSV Fieldids/MJDs (True/False)  
    fps:                                            # Use FPS Fieldids/MJDs (True/False)    
    plates:                                         # Use SDSS-V plate-based Fieldids/MJDs (True/False)    
    legacy:                                         # Use Legacy (pre-SDSS-V) plate-basedFieldids/MJDs (True/False)

customSettings:
    custom_name:                                    # Custom name tag to add to outputs (eg. allepoch)
    allsky:                                         # Custom coadding iregardless of FieldID (True/False)     
    custom_single_mjd:                              # Run Custom Coadding Pipeline for each Coadded MJD seperatly rather then all at once  (True/False)
    schema_file:                                    # Custom schema file for custom coadds (if different from default)        

plan:
    type: daily                                     # Type of spPlan to build (daily, epoch, custom)
    daily:  
        skip2d:                                     # Skip2d the spPlan2d step and build spPlancomb directly from spPlan2d files (True/False)
        skip1d:                                     # Skip the spPlan1d step (True/False)                  
        override_manual:                            # Override the manual flags in the pre-existing Plan Files (True/False) 
        flats:
            matched_flat: False                     # Require Flat from the same Field/plate as science
            multiple_flat:  False                   # Find all possible flat calibration frames
        arcs:
            matched_arc: True                       # Require Arc from the same Field/plate as science
            multiple_arcs: False                    # Find all possible arc calibration frames
            flag_nomatch_manual: False              # if nomatched_arcs is False, builds spplan with unmatched arcs and mark as manual
        minscience: 1                               # Minimum number of science exposures to include plate in spPlan2d (default: 1)
        plate_epoch:                                # Use a variable max epoch length for plate coadd
        quick1d: True                               # Use the list of new spPlan2d as a filter for fields to build spplancomb
        dailyplan_logfile:                          # Logfile for daily spPlan runs
        daily_plan_verbose:                         # Verbose logging for daily spPlan runs (True/False)
    epoch:
#??        minscience_epoch:                        # Minimum number of science exposures to include epoch in spPlanEpoch (default: 1) 
        skipepoch:                                  # Skup the spPlanEpoch creation (True/False)
        abandoned: True                             # Include "Abandoned" epochs in spPlanEpoch (True/False)
        started:                                    # Include "Started" epochs in spPlanEpoch (True/False)
        min_epoch_length: 1                         # Minimum epoch length to be included in spPlanEpoch (in days; default: 1)
        epochplan_logfile:                          # Logfile for spPlanEpoch runs
        max_epoch_length:                           # Used solely for daily epoch runs to limit how many MJDs are checked for abandoned epochs
        use_mos_target: True                        # Use the MOS_TARGET product to build spPlans (otherwise defaults to all abandoned epochs) (True/False) 

    custom:
        coadd_mjdstart:                             # Minimum MJD for custom coadd spPlan (default: 0)  
        batch_plan:                                 # Batch run all active Coadd Schema in batch file located {topdir}/{run2d}/{name} (True/False)
 #       manual:                                    # Manaully run a Coadd Schema (from coaddfile if only name is set) (True/False) - opposite of batch_plan
        DR:                                         # Data Release for custom coadd spPlan (used to determine which manual flags to override) (True/False)
        cartons:                                    # List of cartons to include in custom coadd spPlan (overrides other selection criteria)        
        rerun1d:                                    # Rerun 1d Analysis for custom coadds (True/False)   
        program:                                    # SDSSV Program for custom coadd spPlan (used to determine which manual flags to override)
        catalogids:                                 # List of CatalogIDs (or SDSS_IDs) to include in custom coadd spPlan (overrides other selection criteria)
        use_catid: False                            # Use CatalogID rather than SDSS_ID for custom coadd spPlan (True/False)
        use_firstcarton: False                      # Use Firstcarton only for carton match (dont look at db or semaphore flags) (True/False)
        useDB: False                                # Use sdss targetdb instead of the Semaphore targeting flag (if not use_firstcarton) (True/False)
        customplan_logfile:                         # Logfile for custom spPlan runs
    trace:
        traceplan_logfile:                          # Logfile for spTrace plan runs
        traceplan_verbose:                          # Verbose logging for spTrace plan runs (True/False)
        override_manual_trace:                      # Override the manual flags in the pre-existing Trace Plan Files (True/False)




# Settings for Building the spFibermap files
fibermap:
    no_db: False                                    # Skip DB Queries and use the MOS_TARGET product flat files  (True/False)
    fast_no_db:                                     # If no_db, only get the mininimal information from MOS_TARGET to run pipeline  (True/False)
    datamodel:                                      # Data model file for spFibermap files (if different from default)

#Settings for Extraction, Reduction, and Calibration
reduce:
    MWM_fluxer: True                                # Utilize MWM optional settings (ie gaia reddening and different S/N cuts) (True/False)
    map3d: merge3d                                  # Which 3d Dustmap to use (bayestar15,bay15,merge3d at present)
    saveraw: False                                  # Save sdssproc outputs (True/False)
    debug: False                                    # Save extraction debug files (True/False)
    force_arc2trace: False                          # Force Use of Arc to Trace refinements (True/False) 
    docams:                                         # Set the camera files to extract
    #do_telluric:                                   # Perform telluric-corrections for the red CCDs (deprecated and moved)
    #bbspec                                         # Use bbspec extraction code (deprecated)
    xdisplay:                                       # Use xdiplay instead of file for plots
    writeflatmodel:                                 # Write the Flat Fit Model to file
    writearcmodel:                                  # Write the Arc Fit Model to file
    nitersky:                                       # Number of Sky iterations (default:2)
    gaiaext:                                        # Force Use of 3D Dustmaps
#    corrline:                                      # Final Fit on strong sky lines (deprecated and moved)
    noreject:                                       # Don't reject faint calibration frames

#Seeings for Coadding Frames
combine:
    xyfit: True                                     # Compute 2d flux corrections in the xy focal plane (always on)
    loaddesi: True                                  # Load the DESI (JG) models for fluxing (always on)
    MWM_fluxer: True                                # Utilize MWM optional settings (ie gaia reddening and different S/N cuts) (True/False)
    no_reject: True                                 # Turns off outlier rejection in the coadding (needed for FPS)
    nodist: True                                    # Skip the step to generate and use the spFluxdistort* files (True/False)
    onestep_coadd: False                            # Legacy algorithm for coadd. Coadding blue+red and all exposures at the the same time. (True/False)
    radec_coadd:                                    # Coadd using ra-dec matching rather then catalogID matching
    skipfluxing:                                    # Skip the step to generate spFluxcalib* files 
    skipfcorr:                                      # Skip the step to generate the spFluxcorr* files (but use prexisting spFluxcorr* files)
    nofcorr:                                        # Skip the step to generate and use the spFluxcorr* files
    minsn2:                                         # Minimum S/N^2 to include science frame in coadd
    bscore:                                         # Fraction of best exposure score to use as a threshold for discarding exposures
    custom_coadd:
        end2end:

#Settings for 1d Spectra Analysis Pipelines
analyze:                                            
    spec1d: {}                                      # Settings for the main 1d spectral analysis pipeline (spec1d, etc.)
    XCSAO: {}                                       # Settings for the pyXCSAO redshift analysis pipeline   

#Setting for Post Analysis Steps
post:
    fieldlist:
        create: True                                # Create Fieldlist files (always on except for custom coadds)
        noplot: False                               # Skip Creation of Sky plots
        started: False                              # Include "Started" epochs in fieldlist (True/False)        
        abandoned: True                             # Include "Abandoned" epochs in fieldlist (True/False)
    fieldmerge:
        include_bad: True                           # Include "Bad" data in spAll files (True/False)
        include_XCSAO: True                         # Include pyXCSAO results in spAll files (True/False)
        clobber_fmjd: True                          # Clobber existing Field(CoAdd)-MJD level spAll files (always on)
        skip_specprimary: update                    # Skip creation of specPrimary Flags (None/False, skip, update)
        skip_line:                                  # Skip creation of spAllLine files (True/False)       
        lite: False                                 # Skip creation of spAll-lite files (True/False)
        verbose:                                    # Verbose logging for fieldmerge step (True/False)  
        datamodel_file:                             # Data model file for spAll files (if different from default)   
        line_datamodel_file:                        # Data model file for spAllLine files (if different from default)
        #remerge_fmjd:                              # Remerge a list of field-MJD level spAll files rather than just merging new files (True/False) [deprecated]
        #remerge_mjd:                               # List of MJDs to remerge rather than just merging new files    [deprecated]
        #merge_only: True                           # Only merge existing field-MJD level spAll files rather than building new ones from the spectra (True/False) [deprecated]  
        batchwise:                                  
            ndays:                                  # Number of days worth of field-MJD spAll files to merge in each batch (default: None) 
            #limit:                                  # Maximum number of field-MJD spAll files to merge in each batch (default: None) [deprecated]


    spec:
        plot: True                                  # Create Spectra Preview images (True/False)
        lsdr10:                                     # Add Legacy Survey DR10 links to html preview(True/False) 
    spCalib: {}                                     # Settings for spCalib step (if run)
    healpix: {}                                     # Settings for Healpix creation step (if run)

email:
    sendemail:                                      # Send email notifications for pipeline progress (True/False)   
    allemail:                                       # Send email notifications to full list of emails and not just first (True/False)
    email_start:                                    # Send email at the start (True/False)  

monitor: 
    pipe_monitor: True                              # Monitor the pipeline run, run post-steps, and send email notifications at completion (True/False) 
    pause: 900                                      # Time (in seconds) to pause between checks of the pipeline status when monitoring (default: 900s = 15min)  

Summary:
    include_bad: True                               # Include "Bad" data in spAll files (True/False)
    include_XCSAO: True                             # Include pyXCSAO results in spAll files (True/False)
    clobber_fmjd: True                              # Clobber existing Field(CoAdd)-MJD level spAll files (always on)
    skip_specprimary: update                        # Skip creation of specPrimary Flags (None/False, skip, update)
    skip_line:                                      # Skip creation of spAllLine files (True/False)   
    lite: True                                      # Skip creation of spAll-lite files (True/False)
    verbose:                                        # Verbose logging for Summary merge step (True/False)
    datamodel_file:                                 # Data model file for spAll summary file (if different from default)
    line_datamodel_file:                            # Data model file for spAllLine summary file (if different from default)
    batchwise:
        ndays:                                      # Number of days worth of field-MJD spAll files to merge in each batch (default: None) 
        #limit:                                     # Maximum number of field-MJD spAll files to merge in each batch [deprecated]
        backup:                                     # Backup existing summary spAll files before merging and keep this many old versions (default: 0, which means no backup) 
        n_iter:                                     # Number of iterations to run the batch merge step (default: 1)     
        database:                                   # Load the Pipeline DB with the summary tables after merging (True/False)
        after_daily:                                # Only run the Summary merge after daily runs (True/False)  
        mjdstart:                                   # Select Range of MJDs >= mjdstart
        mjdend:                                     # Select Range of MJDs <= mjdend
        freeze_output:                              # Freeze the summary spAll files after merging (True/False) - use for intermeiate summary files that you can merge new files into without having to rerun the full summary merge
        update_target_flags:                        # Update the target flags in the summary spAll files using spTargeting  rather then based on the spFibermap/spField files (True/False) 
        MJD_dir:                                    # Location of the intermeidate MJD level merged spAll files (default: $BOSS_SPECTRO_SCRATCH/{run2d}/Summary/MJD)
        to_fits:                                    # Also output the summary spAll file in fits format (True/False)
        force_rebuild:                              # Force of the summary spAll files rather than just merging if new files updates (True/False) - use with freeze_output to create a new frozen summary file with the new merged files included
        keep_active:                                # Use "touch" to keep intermediate MJD leveled merged spAll files in SCRATCH active so they are not perged
        clobber_mjd: False                          # Clobber existing MJD level spAll files (True/False) - only applies if batchwise merging is not being used
    fieldlist:
        started: False                              # Include "Started" epochs in fieldlist (True/False)
        abandoned: True                             # Include "Abandoned" epochs in fieldlist (True/False
